<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Gift Voucher | SoundBunker Algarve</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="client-gifts.css"></head><body class="portal-bg"><main class="portal-shell narrow"><a href="/" class="brand-link">SoundBunker Algarve</a><section id="loading" class="panel"><h1>Preparing your voucher…</h1><p>Confirming your secure payment.</p></section><section id="voucher" class="voucher-print" hidden><p class="eyebrow">SoundBunker Algarve</p><h1>Gift Experience</h1><h2 id="vService"></h2><div class="voucher-price" id="vPrice"></div><dl><div><dt>To</dt><dd id="vTo"></dd></div><div><dt>From</dt><dd id="vFrom"></dd></div><div><dt>Valid from</dt><dd id="vDate"></dd></div><div><dt>Voucher code</dt><dd id="vCode"></dd></div></dl><p id="vMessage"></p><p class="muted">Redeem at soundbunker.pt · Experience date subject to availability.</p><button class="primary no-print" onclick="window.print()">Download / Print Voucher</button><a class="pill-link no-print" href="client.html">Go to Client Area</a></section><p id="fail" class="error"></p></main><script>const q=new URLSearchParams(location.search),id=q.get('session_id');fetch('/api/voucher-status?session_id='+encodeURIComponent(id||'')).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok)throw Error(d.error||'Could not load voucher');document.querySelector('#loading').hidden=true;document.querySelector('#voucher').hidden=false;vService.textContent=d.service;vPrice.textContent='€'+d.total;vTo.textContent=d.to;vFrom.textContent=d.from;vDate.textContent=d.startDate;vCode.textContent=d.code;vMessage.textContent=d.message||''}).catch(e=>{document.querySelector('#loading').hidden=true;fail.textContent=e.message});</script></body></html>
