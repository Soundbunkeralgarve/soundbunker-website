<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community | SoundBunker Algarve</title><link rel="stylesheet" href="client-gifts.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="community.js" defer></script></head><body class="portal-bg"><main class="portal-shell"><header class="portal-top"><a href="/client" class="brand-link">← Client Area</a><span class="role-badge">MEMBERS ONLY</span></header><section class="client-hero"><p class="eyebrow">SoundBunker Community</p><h1>Create. Collaborate. Connect.</h1><p>A private creative network for SoundBunker artists, producers, singers, DJs, musicians and creators.</p></section>
<div class="community-layout"><aside class="panel profile-panel"><h2>Your profile</h2><div class="profile-avatar-wrap"><img id="avatarPreview" class="profile-avatar" alt="Profile photo"><input id="avatarFile" type="file" accept="image/*"></div><form id="profileForm"><label>Name<input id="profileName" maxlength="120"></label><label>Artist / stage name<input id="artistName" maxlength="120"></label><label>What do you do?<input id="creativeRole" placeholder="Producer, singer, DJ, songwriter…" maxlength="120"></label><label>Genres / skills<input id="genres" placeholder="House, pop, vocals, guitar…" maxlength="200"></label><label>Bio<textarea id="bio" maxlength="500" rows="3"></textarea></label><label>Music / social link<input id="socialLink" type="url" placeholder="https://…"></label><button class="primary" type="submit">Save profile</button><p id="profileMessage" class="muted"></p></form></aside>
<section><article class="panel chat-compose"><h2>Community feed</h2><form id="postForm"><label>Post type<select id="postType"><option>General Chat</option><option>Collaboration Wanted</option><option>Session Work</option><option>Jobs & Opportunities</option><option>Musicians Wanted</option><option>Track Feedback</option></select></label><label>Message<textarea id="postBody" maxlength="1000" rows="4" placeholder="What are you working on, looking for or offering?" required></textarea></label><label>Share a collaboration file <input id="postFile" type="file" accept="audio/*,.wav,.mp3,.aiff,.m4a,.pdf,.zip"></label><button class="primary" type="submit">Post to community</button><p id="communityMessage" class="muted"></p></form></article><div id="posts" class="chat-feed"></div></section></div></main></body></html>
