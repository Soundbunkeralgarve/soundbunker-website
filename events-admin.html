<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Events Admin | SoundBunker</title><link rel="stylesheet" href="/events.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/events-admin.js"></script></head><body>
<header class="topbar"><a class="brand" href="/"><img src="/soundbunker-logo.png" alt="SoundBunker"></a><nav><a href="/admin">Admin</a><a href="/events">Public Events</a><a href="/event-scanner.html">Door Scanner</a></nav></header><main class="events-content" style="max-width:1100px;margin:auto"><span class="eyebrow">SOUNDBUNKER OPERATIONS</span><h1>Manage Events.</h1><p id="status">Checking admin login…</p>
<div id="panel" hidden><div class="event-grid"><form id="create" class="event-info" style="background:#22162d;border:1px solid #fff3"><h2>Create event</h2><label>Title<input name="title" required minlength="3" maxlength="160"></label><label>URL slug<input name="slug" required placeholder="friday-night-sessions" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>Start time (local)<input type="datetime-local" name="startsAt" required></label><label>Venue<input name="venue" value="The Hub Culture, Loulé"></label><label>Organiser<input name="organiser" value="SoundBunker Algarve"></label><label>Image HTTPS URL<input name="imageUrl" type="url" placeholder="https://…"></label><label>Description<textarea name="description" rows="3"></textarea></label><button class="solid">Create draft</button></form>
<form id="tierForm" class="event-info" style="background:#22162d;border:1px solid #fff3"><h2>Add ticket type</h2><label>Draft event<select name="eventId" id="eventSelect" required></select></label><label>Ticket name<input name="name" value="General admission" required></label><label>Price (€ including VAT)<input name="price" type="number" min="1" step=".01" required></label><label>Capacity<input name="capacity" type="number" min="1" max="100000" required></label><button class="solid">Add tickets</button><p class="muted">Events start as drafts and cannot go on sale until you publish them.</p></form></div>
<h2 style="margin-top:70px">All events</h2><div id="list" class="event-grid"></div></div></main></body></html>
