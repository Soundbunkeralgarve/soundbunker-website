name: TB Organiser App Checks
on:
  pull_request:
    paths: ['theticketbunker-organiser/**', 'ticketbunker-site/pricing-rules.js', '.github/workflows/theticketbunker-organiser-app.yml']
  push:
    branches: [main]
    paths: ['theticketbunker-organiser/**', 'ticketbunker-site/pricing-rules.js', '.github/workflows/theticketbunker-organiser-app.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theticketbunker-organiser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run doctor
      - run: npx expo export --platform android --output-dir dist-android
      - run: npx expo export --platform ios --output-dir dist-ios
