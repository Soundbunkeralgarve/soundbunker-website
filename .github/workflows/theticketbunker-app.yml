name: theticketbunker Fan App Checks
on:
  pull_request:
    paths: ['theticketbunker/**', 'ticketbunker-site/discovery-model.js', 'ticketbunker-site/featured-selection.js', 'ticketbunker-site/get-there.js', 'ticketbunker-site/trip-partners.js', 'ticketbunker-site/travel-directory.js', 'ticketbunker-site/city-places.js', 'ticketbunker-site/city-coords.js', 'ticketbunker-site/place-search.js', 'ticketbunker-site/gyg-box.js', '.github/workflows/theticketbunker-app.yml']
  push:
    branches: [main]
    paths: ['theticketbunker/**', 'ticketbunker-site/discovery-model.js', 'ticketbunker-site/featured-selection.js', 'ticketbunker-site/get-there.js', 'ticketbunker-site/trip-partners.js', 'ticketbunker-site/travel-directory.js', 'ticketbunker-site/city-places.js', 'ticketbunker-site/city-coords.js', 'ticketbunker-site/place-search.js', 'ticketbunker-site/gyg-box.js', '.github/workflows/theticketbunker-app.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theticketbunker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run doctor
      - run: npx expo export --platform android --output-dir dist-android
      - run: npx expo export --platform ios --output-dir dist-ios
