name: Site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Check Events JavaScript syntax
        run: |
          for f in events.js event-ticket.js event-scanner.js events-admin.js api/events.js api/event-admin.js api/event-ticket.js api/event-checkout.js api/event-scan.js api/lib/events.js; do
            node --check "$f"
          done
