name: Site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Check Events JavaScript syntax
        run: |
          for f in events.js event-ticket.js event-scanner.js events-admin.js organiser.js event-free-test.js ticketbunker-dry-run.js ticketbunker-dry-run-model.mjs api/event-staff.js api/organiser.js api/events.js api/event-admin.js api/event-ticket.js api/event-checkout.js api/event-scan.js api/event-free-test.js api/lib/events.js; do
            node --check "$f"
          done

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare auth stub and database roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "create schema auth; create table auth.users(id uuid primary key); create role anon; create role authenticated; create role service_role;"
      - name: Apply Events migration to isolated Postgres
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_EVENTS_SETUP.sql
      - name: Exercise reservations and one-time entry
        run: psql -v ON_ERROR_STOP=1 -f test/events-schema.sql
      - name: Apply Organiser schema migration
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_EVENTS_ORGANISERS_SETUP.sql
      - name: Verify third-party publication safeguards
        run: psql -v ON_ERROR_STOP=1 -f test/events-organisers-schema.sql

      - name: Create test-only profiles stub
        run: psql -v ON_ERROR_STOP=1 -c "create table public.profiles(id uuid primary key,role text);"
      - name: Apply scoped staff invitation schema
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_EVENTS_STAFF_INVITES.sql
      - name: Verify staff invite scope, expiry, reuse and revocation
        run: psql -v ON_ERROR_STOP=1 -f test/events-staff-schema.sql
      - name: Verify atomic event access and revocation
        run: psql -v ON_ERROR_STOP=1 -f test/events-scanner-auth.sql
      - name: Apply ticketBunker showcase request schema
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_TICKETBUNKER_SHOWCASE_SETUP.sql
      - name: Verify showcase requests never auto-charge
        run: psql -v ON_ERROR_STOP=1 -f test/ticketbunker-showcase.sql
      - name: Apply bespoke Festival and Festival Pro pricing schema
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_TICKETBUNKER_FESTIVAL_QUOTES.sql
      - name: Verify festival quote requests stay unpaid
        run: psql -v ON_ERROR_STOP=1 -f test/ticketbunker-festival-quote-schema.sql
      - name: Apply small-events total ticket limit
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_TICKETBUNKER_SMALL_EVENTS_LIMIT.sql
      - name: Verify event tickets cannot exceed 2k across multiple tiers
        run: psql -v ON_ERROR_STOP=1 -f test/ticketbunker-small-events-limit.sql

      - name: Apply registered charity listing exemption schema
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_TICKETBUNKER_CHARITY_LISTINGS.sql
      - name: Verify charity registration cannot waive fees before approval
        run: psql -v ON_ERROR_STOP=1 -f test/ticketbunker-charity-schema.sql
      - name: Apply isolated genuine free-ticket test guard
        run: psql -v ON_ERROR_STOP=1 -f SUPABASE_TICKETBUNKER_REAL_FREE_TEST.sql
      - name: Verify genuine zero-price QR admissions and strict paid-event separation
        run: psql -v ON_ERROR_STOP=1 -f test/ticketbunker-real-free-schema.sql
