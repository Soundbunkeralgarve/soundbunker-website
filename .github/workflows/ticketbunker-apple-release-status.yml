name: Inspect TicketBunker Apple release
on:
  workflow_dispatch:
  push:
    branches: [main, codex/ticketbunker-app-release-20261123]
    paths:
      - .github/workflows/ticketbunker-apple-release-status.yml
      - .github/scripts/ticketbunker-apple-release-status.cjs
      - .github/scripts/ticketbunker-apple-release-status.test.cjs
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Soundbunkeralgarve/soundbunker-website' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/ticketbunker-app-release-20261123')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check status selection and failure handling
        run: node --test .github/scripts/ticketbunker-apple-release-status.test.cjs
      - name: Read current scanner, customer and organiser release records
        env:
          APPLE_KEY_P8: ${{ secrets.HUB_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.HUB_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.HUB_APPLE_API_ISSUER }}
        run: node .github/scripts/ticketbunker-apple-release-status.cjs | tee ticketbunker-apple-release-status.json
      - name: Retain the exact Apple release records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticketbunker-apple-release-status
          path: ticketbunker-apple-release-status.json
          if-no-files-found: warn
          retention-days: 14
