name: Resubmit TicketBunker Scanner iOS build 13
on:
  push:
    branches: [main]
    paths: [.github/workflows/ticketbunker-apple-release-status.yml]
permissions:
  contents: read
concurrency:
  group: ticketbunker-apple-review-build-13
  cancel-in-progress: false
jobs:
  resubmit:
    if: github.repository == 'Soundbunkeralgarve/soundbunker-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify build 13 and resubmit the existing iOS review
        env:
          APPLE_KEY_P8: ${{ secrets.HUB_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.HUB_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.HUB_APPLE_API_ISSUER }}
        run: |
          node <<'JS'
          const { sign } = require('node:crypto');
          const { appendFileSync } = require('node:fs');
          const { setTimeout: delay } = require('node:timers/promises');
          const { APPLE_KEY_P8: key, APPLE_API_KEY_ID: kid, APPLE_API_ISSUER: iss } = process.env;
          const appId = '6823316315';
          const bundleId = 'pt.soundbunker.ticketbunkerscanner';
          const versionId = '59848f34-a461-46a9-b59a-f9d539360302';
          const submissionId = '6d7a1094-960b-4bb0-aaba-f587aae20aa4';
          const oldBuildId = '6884c81c-414e-4a7c-97ab-373f38249798';
          const submittedStates = ['WAITING_FOR_REVIEW', 'IN_REVIEW'];

          function token() {
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const claims = encode({ alg: 'ES256', kid, typ: 'JWT' }) + '.' +
              encode({ iss, iat: now, exp: now + 300, aud: 'appstoreconnect-v1' });
            return claims + '.' + sign('sha256', Buffer.from(claims), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          }

          async function apple(path, data) {
            const method = data ? 'PATCH' : 'GET';
            const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + path, {
              method,
              headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' },
              body: data ? JSON.stringify({ data }) : undefined,
              signal: AbortSignal.timeout(30000),
              redirect: 'error',
            });
            if (response.status === 204) return null;
            const result = await response.json();
            if (!response.ok) {
              const errors = result.errors?.map(({ code, title, detail }) => ({ code, title, detail }));
              throw Error(`${method} ${path} returned ${response.status}: ${JSON.stringify(errors)}`);
            }
            return result;
          }

          function assert(condition, message) {
            if (!condition) throw Error(message);
          }

          function report(message) {
            console.log(message);
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n');
          }

          async function processedBuild() {
            const query = new URLSearchParams({
              'filter[app]': appId,
              'filter[version]': '13',
              include: 'preReleaseVersion',
            });
            for (let attempt = 0; attempt < 24; attempt++) {
              const result = await apple('builds?' + query);
              const build = result.data.find(entry => entry.attributes.version === '13' &&
                result.included?.some(version => version.id === entry.relationships?.preReleaseVersion?.data?.id &&
                  version.attributes.version === '1.0.1' && version.attributes.platform === 'IOS'));
              const state = build?.attributes.processingState;
              console.log(`App Store Connect processing for 1.0.1 (13): ${state ?? 'not visible yet'}`);
              if (state === 'VALID') {
                assert(!build.attributes.expired, 'Build 13 has expired');
                return build;
              }
              assert(!state || state === 'PROCESSING', `Build 13 processing ended with ${state}`);
              await delay(45000);
            }
            throw Error('Apple has not made build 13 available yet. Re-run this job after processing.');
          }

          async function run() {
            assert(key && kid && iss, 'The existing Apple release credentials are required');
            const app = (await apple(`apps/${appId}?fields[apps]=bundleId`)).data;
            assert(app.attributes.bundleId === bundleId, 'Unexpected Apple app');
            const version = (await apple(`appStoreVersions/${versionId}?fields[appStoreVersions]=platform,versionString,appStoreState`)).data;
            assert(version.attributes.platform === 'IOS' && version.attributes.versionString === '1.0.1', 'Unexpected App Store version');
            const build = await processedBuild();
            const reviewPath = `reviewSubmissions/${submissionId}`;
            const versionBuildPath = `appStoreVersions/${versionId}/relationships/build`;
            const getReview = async () => (await apple(reviewPath)).data;
            const getSelectedBuild = async () => (await apple(versionBuildPath)).data;
            const [review, selected] = await Promise.all([getReview(), getSelectedBuild()]);
            console.log(`Existing review state: ${review.attributes.state}. Selected build: ${selected?.id ?? 'none'}.`);
            if (submittedStates.includes(review.attributes.state) && selected?.id === build.id) {
              report(`TicketBunker Scanner 1.0.1 (13) is already ${review.attributes.state}.`);
              return;
            }
            assert(review.attributes.platform === 'IOS', 'Unexpected review platform');
            assert(['UNRESOLVED_ISSUES', 'READY_FOR_REVIEW'].includes(review.attributes.state), `Unexpected review state: ${review.attributes.state}`);
            assert([oldBuildId, build.id].includes(selected?.id), 'The selected build changed during this repair');

            const itemsPath = `${reviewPath}/items?include=appStoreVersion`;
            const getItems = async () => (await apple(itemsPath)).data;
            const items = await getItems();
            const item = items.find(entry => entry.relationships?.appStoreVersion?.data?.id === versionId);
            assert(items.length === 1 && item, 'Review contains additional items or the iOS app version is missing');
            console.log(`Existing app review item state: ${item.attributes.state}`);

            if (build.attributes.usesNonExemptEncryption == null) {
              const previous = (await apple(`builds/${oldBuildId}?fields[builds]=version,usesNonExemptEncryption`)).data;
              assert(previous.attributes.version === '12' && previous.attributes.usesNonExemptEncryption === false,
                'Apple requires an export-compliance determination for build 13');
              await apple(`builds/${build.id}`, {
                type: 'builds', id: build.id, attributes: { usesNonExemptEncryption: false },
              });
              console.log('Applied build 12’s existing export-compliance setting to the camera-only update.');
            } else {
              assert(build.attributes.usesNonExemptEncryption === false, 'Apple requires an export-compliance review for build 13');
            }

            if (selected.id !== build.id) await apple(versionBuildPath, { type: 'builds', id: build.id });
            assert((await getSelectedBuild())?.id === build.id, 'App Store Connect did not select build 13');

            if (item.attributes.state !== 'READY_FOR_REVIEW') {
              await apple(`reviewSubmissionItems/${item.id}`, {
                type: 'reviewSubmissionItems', id: item.id, attributes: { resolved: true },
              });
            }
            const updatedItems = await getItems();
            assert(updatedItems.some(entry => entry.id === item.id && entry.attributes.state === 'READY_FOR_REVIEW'),
              'Apple did not mark the repaired app version ready for review');
            await apple(reviewPath, {
              type: 'reviewSubmissions', id: submissionId, attributes: { submitted: true },
            });

            for (let attempt = 0; attempt < 10; attempt++) {
              const [current, currentBuild] = await Promise.all([getReview(), getSelectedBuild()]);
              assert(currentBuild?.id === build.id, 'The submitted build changed');
              if (submittedStates.includes(current.attributes.state)) {
                report(`TicketBunker Scanner 1.0.1 (13): ${current.attributes.state}.`);
                return;
              }
              console.log(`Waiting for Apple to confirm review submission: ${current.attributes.state}.`);
              await delay(15000);
            }
            throw Error('Apple did not confirm the review state after resubmission.');
          }

          run().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
