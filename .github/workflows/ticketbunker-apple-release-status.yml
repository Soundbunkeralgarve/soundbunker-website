name: Inspect TicketBunker Apple release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ticketbunker-apple-release-status.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Soundbunkeralgarve/soundbunker-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read processing and review status for the existing scanner app
        env:
          APPLE_KEY_P8: ${{ secrets.HUB_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.HUB_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.HUB_APPLE_API_ISSUER }}
        run: |
          node <<'JS'
          (function inspectRelease() {
            const {sign}=require('node:crypto');
            const {appendFileSync}=require('node:fs');
            const {APPLE_KEY_P8:key,APPLE_API_KEY_ID:kid,APPLE_API_ISSUER:iss}=process.env;
            if (!key||!kid||!iss) throw Error('Existing Apple release credentials are required');
            const encode=value=>Buffer.from(JSON.stringify(value)).toString('base64url');
            const now=Math.floor(Date.now()/1000);
            const claim=encode({alg:'ES256',kid,typ:'JWT'})+'.'+encode({iss,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
            const token=claim+'.'+sign('sha256',Buffer.from(claim),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const appId='6823316315';
            const submissionId='6d7a1094-960b-4bb0-aaba-f587aae20aa4';
            const versionId='59848f34-a461-46a9-b59a-f9d539360302';
            const targetBuild='2e0ff04b-64d8-4794-8c89-d6d6760838ae';
          
            async function get(path,apiVersion='v1') {
              const response=await fetch(`https://api.appstoreconnect.apple.com/${apiVersion}/${path}`,{
                headers:{Authorization:'Bearer '+token},
                redirect:'error',
                signal:AbortSignal.timeout(30000),
              });
              const result=await response.json();
              if (!response.ok) {
                throw Error(`Apple HTTP ${response.status}: ${result.errors?.map(error=>error.code).join(', ')}`);
              }
              return result;
            }
          
            async function territories() {
              const availability=(await get(`apps/${appId}/appAvailabilityV2`)).data;
              const result=await get(`appAvailabilities/${availability.id}/territoryAvailabilities?include=territory&limit=200`,'v2');
              const france=result.data.find(row=>row.relationships?.territory?.data?.id==='FRA');
              return {franceSelected:france?.attributes?.available??null, hasMore:Boolean(result.links?.next)};
            }
          
            async function declarations() {
              const query=new URLSearchParams({'fields[appEncryptionDeclarations]':'appEncryptionDeclarationState,platform,availableOnFrenchStore,exempt,containsProprietaryCryptography,containsThirdPartyCryptography'});
              const result=await get(`apps/${appId}/appEncryptionDeclarations?${query}`);
              return result.data.map(row=>row.attributes);
            }
          
            async function inspect() {
              const app=(await get(`apps/${appId}?fields[apps]=bundleId`)).data;
              if (app.attributes.bundleId!=='pt.soundbunker.ticketbunkerscanner') throw Error('Wrong Apple app');
              const [version,selected,build,review,otherReviews,availability,encryption]=await Promise.all([
                get(`appStoreVersions/${versionId}?fields[appStoreVersions]=platform,versionString,appStoreState,appVersionState,releaseType`),
                get(`appStoreVersions/${versionId}/relationships/build`),
                get(`builds/${targetBuild}?fields[builds]=version,processingState,usesNonExemptEncryption,appEncryptionDeclaration`),
                get(`reviewSubmissions/${submissionId}?fields[reviewSubmissions]=state,platform`),
                get(`apps/${appId}/reviewSubmissions?limit=10&fields[reviewSubmissions]=state,platform,submittedDate`).catch(error=>({error:error.message})),
                territories().catch(error=>({error:error.message})),
                declarations().catch(error=>({error:error.message})),
              ]);
              if (version.data.attributes.platform!=='IOS'||version.data.attributes.versionString!=='1.0.1'||build.data.attributes.version!=='13') {
                throw Error('Unexpected TicketBunker iOS version or build');
              }
              const record={
                version:version.data.attributes,
                selectedBuild13:selected.data?.id===targetBuild,
                build13:build.data.attributes,
                hasAttachedDeclaration:Boolean(build.data.relationships?.appEncryptionDeclaration?.data),
                review:review.data.attributes,
                otherReviews:otherReviews.data?.filter(entry=>entry.attributes.platform==='IOS').map(entry=>({state:entry.attributes.state,date:entry.attributes.submittedDate}))??otherReviews.error,
                availability,
                encryption,
              };
              const output=JSON.stringify(record,null,2);
              console.log(output);
              if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY,'```json\n'+output+'\n```\n');
            }
          
            inspect().catch(error=>{console.error(error.message);process.exitCode=1});
          })();
          JS
