name: Inspect new TicketBunker app signing metadata
on:
  workflow_dispatch:
  push:
    branches: [codex/ticketbunker-signing-audit-20261123]
    paths:
      - .github/workflows/ticketbunker-signing-audit.yml
      - .github/scripts/ticketbunker-signing-audit.cjs
      - .github/scripts/ticketbunker-signing-audit.test.cjs
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Soundbunkeralgarve/soundbunker-website' && github.ref == 'refs/heads/codex/ticketbunker-signing-audit-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify metadata scope and output filtering
        run: node --test .github/scripts/ticketbunker-signing-audit.test.cjs
      - name: Read distribution certificate and the two new bundle IDs and profiles
        env:
          APPLE_KEY_P8: ${{ secrets.HUB_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.HUB_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.HUB_APPLE_API_ISSUER }}
        run: node .github/scripts/ticketbunker-signing-audit.cjs
