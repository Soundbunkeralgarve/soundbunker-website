name: TicketBunker Scanner iOS Simulator Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ticketbunker-scanner-native/**'
      - '.github/workflows/ticketbunker-scanner-ios.yml'
  push:
    branches: [main]
    paths:
      - 'ticketbunker-scanner-native/**'
      - '.github/workflows/ticketbunker-scanner-ios.yml'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ticketbunker-scanner-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Verify scanner rules
        run: npm test
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build for iPhone Simulator (no store credentials required)
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -type d | head -n 1)"
          test -n "$WORKSPACE"
          # Match the app scheme exactly: Pods-TicketBunkerScanner also contains
          # "TicketBunker" but builds dependencies without producing an app.
          SCHEME="TicketBunkerScanner"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$PWD/build-cache" build > ios-build.log 2>&1 || { tail -n 120 ios-build.log; exit 1; }
      - name: Verify and package the simulator app
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build-cache/Build/Products/Debug-iphonesimulator/TicketBunkerScanner.app"
          test -d "$APP_PATH"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$APP_ID" = "pt.soundbunker.ticketbunkerscanner"
          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -x "$APP_PATH/$APP_EXECUTABLE"
          mkdir -p dist
          tar -czf dist/ticketbunker-scanner-ios-simulator.tar.gz -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
      - uses: actions/upload-artifact@v4
        with:
          name: ticketbunker-scanner-ios-simulator
          path: ticketbunker-scanner-native/dist/ticketbunker-scanner-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ticketbunker-scanner-ios-build-log
          path: ticketbunker-scanner-native/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
