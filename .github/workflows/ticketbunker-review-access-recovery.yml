name: Recover existing scanner review access
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ticketbunker-review-access-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'Soundbunkeralgarve/soundbunker-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read only the existing dedicated scanner reviewer account
        env:
          APPLE_KEY_P8: ${{ secrets.HUB_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.HUB_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.HUB_APPLE_API_ISSUER }}
        run: |
          node <<'JS'
          const crypto=require('node:crypto'),fs=require('node:fs');
          const {APPLE_KEY_P8:key,APPLE_API_KEY_ID:kid,APPLE_API_ISSUER:iss}=process.env;
          if(!key||!kid||!iss)throw Error('Existing Apple API connection is unavailable');
          const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const now=Math.floor(Date.now()/1000),unsigned=enc({alg:'ES256',kid,typ:'JWT'})+'.'+enc({iss,iat:now,exp:now+300,aud:'appstoreconnect-v1'});
          const token=unsigned+'.'+crypto.sign('sha256',Buffer.from(unsigned),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          async function get(path){const r=await fetch('https://api.appstoreconnect.apple.com/v1/'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('Apple API HTTP '+r.status);return r.json();}
          (async()=>{
           const app=await get('apps/6823316315');if(app.data?.attributes?.bundleId!=='pt.soundbunker.ticketbunkerscanner')throw Error('Wrong app');
           const d=await get('appStoreVersions/59848f34-a461-46a9-b59a-f9d539360302/appStoreReviewDetail');
           const a=d.data?.attributes||{};
           if(!a.demoAccountName||!a.demoAccountPassword)throw Error('No reusable reviewer credentials saved in Apple');
           if(!/review|demo/i.test(a.demoAccountName))throw Error('Saved account does not identify itself as a dedicated review account');
           const payload=Buffer.from(JSON.stringify({demoAccountName:a.demoAccountName,demoAccountPassword:a.demoAccountPassword,notes:a.notes||''}));
           const secret=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',secret,iv);
           const ciphertext=Buffer.concat([cipher.update(payload),cipher.final()]);
           const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAh0RDi2jf6WBhzEjUNPR2\nZhdi3YLBE+JNzgZqOr6sfzrQJO+cK8ue7txxBKk4jHH2p6OcAxgeKzHjlc4J3mhl\nriCJVHraehfcNufrtPsb99mlplR03LDCOZL/Nk+iUm2F5k5QwU+eRNPfI43OT2Xf\nsBUvXEHjKlvank/8mMuAyqLyaVpzG9nOwJBp767/uIIeJcAHau4HJ0gJubhyA08g\nFjnO1HWNYpfnlzp1M4Iq0tTXI7IQwV1mYz40/XsKPuPxxFAvkcjqzAdaHwgYHdms\niU3elF/KcfME0mHh2ixE/n6PT+GKHWz8wVSEiNV+Vp+FCx2s1+8dTD4NletBsTTs\nkUE6Zsza64OOJ5QeQ5maP63Ya5JtxdtR5dYXv1cRzf+VBmTsCegdC8CNlb46HIQ2\nBUKoJa71RkO41Fi9thyCYZ4qJx7M/2XfnsRTC2F2eoQnM3Ldak3AIaPOj7H1BdhB\nVbHLpH7eGL/StopShA+RZUF/9GCeM3tRlyildNMDrWFZAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256',padding:crypto.constants.RSA_PKCS1_OAEP_PADDING},secret);
           fs.mkdirSync('review-access',{mode:0o700});
           fs.writeFileSync('review-access/review-access.encrypted.json',JSON.stringify({v:1,key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),ciphertext:ciphertext.toString('base64')}),{mode:0o600});
           console.log('Dedicated review access recovered into an encrypted one-day artifact. No credentials logged.');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ticketbunker-review-access-encrypted
          path: review-access/review-access.encrypted.json
          retention-days: 1
          if-no-files-found: error
