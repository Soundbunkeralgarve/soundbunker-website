name: TicketBunker Local Hub Checks
on:
  pull_request:
    paths: ['ticketbunker-hub/**', 'ticketbunker-scanner-native/**', 'SUPABASE_TICKETBUNKER_OFFLINE_SCANNER.sql', 'api/event-scanner-offline.js', 'api/event-organiser-report.js', 'test/offline-*.test.mjs']
  push:
    branches: [main]
    paths: ['ticketbunker-hub/**', 'ticketbunker-scanner-native/**', 'SUPABASE_TICKETBUNKER_OFFLINE_SCANNER.sql']
permissions:
  contents: read
jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-vm-modules --test test/offline-*.test.mjs test/scanner-api.test.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: ticketbunker-hub
      - run: npm test
        working-directory: ticketbunker-hub
