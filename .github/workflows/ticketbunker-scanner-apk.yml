name: TicketBunker Scanner Android Installable Test Build
on:
  workflow_dispatch:
  pull_request:
    paths: ['ticketbunker-scanner-native/**', '.github/workflows/ticketbunker-scanner-apk.yml']
  push:
    branches: [main]
    paths:
      - 'ticketbunker-scanner-native/**'
      - '.github/workflows/ticketbunker-scanner-apk.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ticketbunker-scanner-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install packages
        run: npm ci --no-audit --no-fund
      - name: Validate QR rules
        run: npm test
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Assemble Android debug APK for internal device testing
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ticketbunker-scanner-native/android
      - uses: actions/upload-artifact@v4
        with:
          name: ticketbunker-scanner-android-internal-apk
          path: ticketbunker-scanner-native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
