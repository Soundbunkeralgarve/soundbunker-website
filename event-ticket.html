<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#100b16"><title>Your ticket | SoundBunker</title><link rel="stylesheet" href="/events.css"></head><body>
<header class="topbar"><a class="brand" href="/"><img src="/assets/ticketbunker/ticketbunker-logo.svg" alt="ticketBunker"></a><nav><a href="/events">All Events</a></nav></header><main class="events-content"><div style="max-width:500px;margin:0 auto;text-align:center;border:1px solid #ffffff33;padding:30px;background:#201528"><p class="eyebrow">TICKETBUNKER / QR TICKET</p><div id="ticketArtwork"></div><h1 id="name">Loading your ticket…</h1><p id="details" style="line-height:1.6;color:#d9c8e2"></p><div id="qr" style="padding:25px;background:#fff;border-radius:8px;width:max-content;max-width:100%;margin:30px auto"></div><p id="notice" role="status">Show this QR code to staff at the entrance. Each ticket is valid for one entry.</p><div class="ticket-download-actions"><button id="saveTicket" type="button">Download QR PNG</button><button id="printTicket" type="button">Print / Save PDF</button><a id="shareTicketWhatsApp" href="#" target="_blank" rel="noopener noreferrer">Share by WhatsApp</a><a id="shareTicketEmail" href="#">Share by email</a></div><p style="color:#c6b8ce;font-size:13px">Keep this link private. Anyone holding it can use this ticket once.</p></div></main>
<style>.ticket-download-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}.ticket-download-actions button,.ticket-download-actions a{border:1px solid #ddc0ed;border-radius:8px;background:#fff;color:#3c2251;padding:11px 12px;text-decoration:none;font-weight:800;cursor:pointer;font:700 12px sans-serif}#ticketArtwork img{max-width:100%;border-radius:8px;max-height:190px;object-fit:cover}#ticketArtwork .event-brand-mark{width:95px;max-height:65px;object-fit:contain;background:#fff;padding:5px;margin:8px}@media print{header,.ticket-download-actions{display:none!important}body{background:#fff;color:#17111f!important}main{padding:0!important}#qr{page-break-inside:avoid}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script><script defer src="/event-ticket.js"></script></body></html>
